name: Verify gameplay and responsive layout
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run logic and UI wiring regression tests
        run: npm test
      - name: JavaScript syntax
        run: |
          node --check src/core/Game.js
          node --check src/core/Renderer.js
          node --check src/ui/Interface.js
          node --check src/ui/StoryFlow.js
          node --check src/data/storyScenes.js
          node --check src/ui/BattleExperience.js
          node --check src/data/interference.js
          node --check src/data/battleChatter.js
          node --check src/core/Audio.js
          node --check src/core/MusicDirector.js
          node --check src/core/HeartAbilities.js
          node --check src/core/HeartVFX.js
          node --check src/core/HeartVFXV2.js
          node --check src/core/HeartVFXSpectacle.js
          node --check src/core/SekaiMapArtV2.js
          node --check src/data/heartEffects.js
  visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve game locally and walk through five screen sizes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          sleep 2
          node tests/visual.mjs
      - name: Save screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sekai-visual-check
          path: artifacts/
          if-no-files-found: ignore
